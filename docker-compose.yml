services:
  # ── PHP-FPM application ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ggnf_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - ggnf_net

  # ── Nginx web server ────────────────────────────────────────
  webserver:
    image: nginx:1.25-alpine
    container_name: ggnf_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - app_public:/var/www/html/public:ro
    networks:
      - ggnf_net
    depends_on:
      - app

# ── Named volumes ───────────────────────────────────────────
volumes:
  app_storage:
    driver: local
  app_public:
    driver: local

# ── Network ─────────────────────────────────────────────────
networks:
  ggnf_net:
    driver: bridge
